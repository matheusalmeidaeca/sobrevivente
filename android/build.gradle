plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Bibliotecas nativas do LibGDX (.so) para a ABI do aparelho alvo.
configurations {
    natives
}

android {
    namespace 'com.sobrevivente.jogo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sobrevivente.jogo'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            assets.srcDirs = ['assets']
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
}

// Copia os .so do gdx-platform para android/libs/arm64-v8a antes de empacotar.
// Sem isso o app fecha ao abrir (biblioteca nativa não encontrada).
tasks.register('copyAndroidNatives') {
    doFirst {
        file('libs/arm64-v8a/').mkdirs()
        configurations.natives.copy().files.each { jar ->
            if (jar.name.endsWith('natives-arm64-v8a.jar')) {
                copy {
                    from zipTree(jar)
                    into file('libs/arm64-v8a')
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach { tarefa ->
    tarefa.dependsOn 'copyAndroidNatives'
}
