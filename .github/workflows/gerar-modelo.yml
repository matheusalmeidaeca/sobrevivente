# .github/workflows/gerar-modelo.yml
# Manual (workflow_dispatch). Gera o boneco do marco F0 e entrega como artefato baixavel.
name: Gerar modelo

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ATENCAO: se o build-apk.yml usa outro passo para instalar o Gradle 8.5, copie ESTE passo de la.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Gerar boneco (F0)
        working-directory: ferramentas/gerador-boneco-kotlin
        run: gradle run --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: boneco-f0
          path: ferramentas/gerador-boneco-kotlin/saida
          retention-days: 14
